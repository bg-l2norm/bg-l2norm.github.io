<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="{{ page.excerpt | default: site.description | strip_html | normalize_whitespace | escape }}">
    <title>{% if page.url == '/' %}{{ site.title }}{% elsif page.title %}{{ page.title }} · {{ site.title }}{% else %}{{ site.title }}{% endif %}</title>
    <link rel="stylesheet" href="{{ '/assets/css/site.css?v=20260726-3' | relative_url }}">
  </head>
  <body>
    <header class="site-header">
      <div class="site-header-banner" aria-hidden="true">
        <img
          src="{{ '/assets/images/rosenbrock-manual-shooting-star-banner-v2.svg' | relative_url }}"
          alt=""
          width="1152"
          height="152"
          decoding="async"
          fetchpriority="high">
      </div>

      <div class="site-header-copy">
        <p class="site-title"><a href="{{ '/' | relative_url }}">{{ site.title }}</a></p>
        <nav class="site-nav" aria-label="Primary navigation">
          <a href="{{ '/' | relative_url }}"{% if page.url == '/' %} aria-current="page"{% endif %}>Home</a>
          <a href="{{ '/blog/' | relative_url }}"{% if page.url == '/blog/' or page.collection == 'posts' %} aria-current="page"{% endif %}>Blog</a>
          <a href="{{ '/notes/' | relative_url }}"{% if page.url == '/notes/' or page.collection == 'notes' %} aria-current="page"{% endif %}>Notes</a>
        </nav>
      </div>
    </header>

    <div class="page-grid">
      <main id="content">
        {{ content }}
      </main>
      {% include sidebar.html %}
    </div>

    <script>
      (() => {
        const items = Array.from(document.querySelectorAll("details.event-item"));

        const clearEventHash = () => {
          history.replaceState(null, "", window.location.pathname + window.location.search);
        };

        const syncEventsWithHash = () => {
          const id = decodeURIComponent(window.location.hash.slice(1));
          const target = id ? document.getElementById(id) : null;
          const selected = target && target.matches("details.event-item") ? target : null;

          items.forEach((item) => {
            item.open = item === selected;
          });

          if (selected) {
            requestAnimationFrame(() => selected.scrollIntoView({ block: "start" }));
          }
        };

        items.forEach((item) => {
          const summary = item.querySelector("summary");

          summary?.addEventListener("click", (event) => {
            event.preventDefault();

            if (item.open && window.location.hash === `#${item.id}`) {
              item.open = false;
              clearEventHash();
              summary.focus();
              return;
            }

            window.location.hash = item.id;
          });
        });

        document.addEventListener("click", (event) => {
          const button = event.target.closest("[data-close-event]");
          if (!button) return;

          const item = button.closest("details.event-item");
          if (!item) return;

          item.open = false;
          clearEventHash();
          item.querySelector("summary")?.focus();
        });

        window.addEventListener("hashchange", syncEventsWithHash);
        syncEventsWithHash();
      })();
    </script>
  </body>
</html>
