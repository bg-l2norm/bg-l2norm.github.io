<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="{{ page.excerpt | default: site.description | strip_html | normalize_whitespace | escape }}">
    <title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
    <link rel="stylesheet" href="{{ '/assets/css/site.css' | relative_url }}">
  </head>
  <body>
    <header class="site-header{% if page.url == '/' %} site-header--home{% endif %}">
      <div class="site-header-copy">
        <h1><a href="{{ '/' | relative_url }}">{{ site.title }}</a></h1>
        <nav aria-label="Primary navigation">
          <a href="{{ '/' | relative_url }}">Home</a>
          <a href="{{ '/blog/' | relative_url }}">Blog</a>
          <a href="{{ '/notes/' | relative_url }}">Notes</a>
        </nav>
      </div>

      {% if page.url == '/' %}
        <figure class="site-header-art">
          <img
            src="{{ '/assets/images/icefire-gradient-flow-header.png' | relative_url }}"
            alt="A three-dimensional gradient-flow energy landscape with a square magnified inset."
            width="900"
            height="739"
            decoding="async"
            fetchpriority="high">
        </figure>
      {% endif %}
    </header>

    <div class="page-grid">
      <main id="content">
        {{ content }}
      </main>
      {% include sidebar.html %}
    </div>

    <script>
      (() => {
        const items = Array.from(document.querySelectorAll("details.event-item"));

        const clearEventHash = () => {
          history.replaceState(null, "", window.location.pathname + window.location.search);
        };

        const syncEventsWithHash = () => {
          const id = decodeURIComponent(window.location.hash.slice(1));
          const target = id ? document.getElementById(id) : null;
          const selected = target && target.matches("details.event-item") ? target : null;

          items.forEach((item) => {
            item.open = item === selected;
          });

          if (selected) {
            requestAnimationFrame(() => selected.scrollIntoView({ block: "start" }));
          }
        };

        items.forEach((item) => {
          const summary = item.querySelector("summary");

          summary?.addEventListener("click", (event) => {
            event.preventDefault();

            if (item.open && window.location.hash === `#${item.id}`) {
              item.open = false;
              clearEventHash();
              summary.focus();
              return;
            }

            window.location.hash = item.id;
          });
        });

        document.addEventListener("click", (event) => {
          const button = event.target.closest("[data-close-event]");
          if (!button) return;

          const item = button.closest("details.event-item");
          if (!item) return;

          item.open = false;
          clearEventHash();
          item.querySelector("summary")?.focus();
        });

        window.addEventListener("hashchange", syncEventsWithHash);
        syncEventsWithHash();
      })();
    </script>
  </body>
</html>
