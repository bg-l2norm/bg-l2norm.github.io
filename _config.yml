title: "bg-l2norm"
description: ""
url: "https://bg-l2norm.github.io"
baseurl: ""

author:
  name: "bg-l2norm"
  github: "bg-l2norm"

permalink: /blog/:year/:month/:day/:title/
excerpt_separator: "<!--more-->"

collections:
  notes:
    output: true
    permalink: /notes/:name/

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      comments: true
  - scope:
      path: ""
      type: notes
    values:
      layout: default

giscus:
  repo: "bg-l2norm/bg-l2norm.github.io"
  repo_id: ""
  category: "Announcements"
  category_id: ""

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor
