title: "bg-l2norm"
description: "Notes, essays, projects, and assorted fragments."
url: "https://bg-l2norm.github.io"
baseurl: ""

# Used in the header and footer.
author:
  name: "bg-l2norm"
  email: "bengeorge1001@gmail.com"
  github: "bg-l2norm"

permalink: /blog/:year/:month/:day/:title/
excerpt_separator: "<!--more-->"

collections:
  notes:
    output: true
    permalink: /notes/:name/

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      comments: true
  - scope:
      path: ""
      type: notes
    values:
      layout: default

plugins:
  - jekyll-feed

feed:
  path: feed.xml

# Fill these values after configuring https://giscus.app
# Comments remain hidden until all four required values are present.
giscus:
  repo: "bg-l2norm/bg-l2norm.github.io"
  repo_id: ""
  category: "Announcements"
  category_id: ""

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor
